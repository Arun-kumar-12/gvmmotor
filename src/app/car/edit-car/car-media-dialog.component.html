<div class="media-dialog">
  <h3>Upload Car Media</h3>
  <div class="slots-grid">
    <div class="slot" *ngFor="let s of slots">
      <div class="slot-label">{{s.label}}</div>
      <div class="slot-preview" [ngClass]="{'video-slot': s.type==='video'}">
        <ng-container *ngIf="s.preview; else showUrl">
          <img *ngIf="s.type==='image'" [src]="s.preview" />
          <video *ngIf="s.type==='video'" [src]="s.preview" controls></video>
        </ng-container>
        <ng-template #showUrl>
          <img *ngIf="s.url && s.type==='image'" [src]="s.url" />
          <video *ngIf="s.url && s.type==='video'" [src]="s.url" controls></video>
          <div *ngIf="!s.url" class="empty-slot">No file</div>
        </ng-template>
      </div>

      <div class="slot-actions">
        <label class="choose-btn">
          Choose
          <input type="file" [accept]="s.type==='image' ? 'image/*' : 'video/*'" (change)="onFileChange($event, s)" hidden>
        </label>
        <button class="remove-btn" *ngIf="(s.url || s.preview)" (click)="removeSlot(s)">Remove</button>
      </div>
    </div>
  </div>

  <div class="dialog-actions">
    <button mat-button (click)="close()">Cancel</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="uploading">Save</button>
  </div>
</div>
